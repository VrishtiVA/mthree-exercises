<!DOCTYPE html>
<html>
<head>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script> -->
    <!-- My Scripts -->
    <script type="module" src="./home.js" defer></script>

</head>
<body>

    <!-- Header -->
    <header class="mt-4 container-sm text-center">
        <h1>Weather Page</h1>
        <hr/>
    </header>
    
    <!-- Form -->
    <section class="container-sm">
        
        <div id="weatherFeedbackAlert" class="alert alert-danger" role="alert">Something went wrong. Please try again later.</div>

        <div class="text-center d-flex flex justify-content-center gap-3 flex-wrap">
            <div class="d-flex align-items-end gap-2">
                <div class="col-auto">
                    <label for="weatherZipCode" class="form-label">Zipcode</label>
                </div>
                <div class="col-auto">
                    <input type="text" maxlength="5" minlength="5" class="form-control" id="weatherZipCode" placeholder="Enter Zipcode ..."/>
                </div>
            </div>
            <div class="d-flex align-items-end gap-2">
                <div class="col-auto">
                    <label for="weatherUnits" class="form-label">Units</label>
                </div>
                <div class="col-auto">
                    <select id="weatherUnits" class="form-select" aria-label="Units">
                        <option value="Imperial">Imperial</option>
                        <option value="Metric">Metric</option>
                    </select>
                </div>
            </div>
            <button id="weatherSubmitBtn" type="submit" class="btn btn-primary">Get Weather</button>
        </div>
    </section>

    <!-- City block -->
    <section class="container-sm text-center" id="weatherResults">
        <hr/>
        <h4>Current Conditions in <span id="weatherResultsCity">|City|</span></h4>
        <section>
            <!-- Current weather widget -->
            <article>

            </article>
            <!-- Weather break down widget -->
            <article>

            </article>
        </section>
        
        <hr/>
        <h4>Five Day Forcast</h4>
        <section id="weatherFiveDayForecastContainer">

        </section>

    </section>    
</body>
</html>
